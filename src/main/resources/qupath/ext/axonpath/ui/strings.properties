## General
title = AxonPath
extension.description = Run AxonPath deep learning models to segment fibres, inner cylinders and axons in EM and brightfield images, with morphometric measurements and tools for manual correction
extension.title = AxonPath
# Required QuPath version
extension.qupath.version = v0.7.0

## Extensions menu
menu.open = AxonPath
menu.script.segmentation = Segmentation script template

